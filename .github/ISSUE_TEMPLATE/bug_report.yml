name: Bug report
description: Report a reproducible problem with Metadata Polisher.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For a suspected security vulnerability, follow SECURITY.md before sharing details.
        Remove personal paths, music files, credentials and contact details from reports and screenshots.
  - type: input
    id: version
    attributes:
      label: Application version or source revision
      placeholder: Version shown by the application, release name or Git commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Windows version and whether this is a portable build or a source launch. Include the Python version for source launches.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the smallest reproducible example. Use generated or sanitised data; do not upload private music.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact sanitised error message and whether any files were changed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context and diagnostics
      description: If relevant, include the media format, existing tag version, selected provider and network mode. State whether the problem also happens offline. Review logs and screenshots for private information before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials and private data from this report and any attachments.
          required: true
