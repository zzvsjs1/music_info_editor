name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src scripts
      - name: Offline tests
        # Use a fixed desktop size so the runner's display cannot clip test windows.
        run: python scripts/test_offscreen.py -q
      - name: Native Windows rendering and lifecycle tests
        env:
          QT_QPA_PLATFORM: windows
        # Native theme painting and process shutdown need the Windows backend.
        run: >-
          python -m pytest -q
          tests/ui/test_quick_presentation_regressions.py::test_native_review_scrollbar_has_no_white_edge
          tests/ui/test_quick_table_interaction.py::test_native_horizontal_scrollbar_has_a_continuous_track
          tests/ui/test_quick_process_lifecycle.py
      - name: Build Python source and wheel distributions
        run: python -m build
      - name: Check distribution contents
        run: python scripts/check_release.py dist
