name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Layout regressions use native Windows font metrics and screen geometry.
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src scripts
      - name: Offline tests
        run: python -m pytest -q
      - name: Build Python source and wheel distributions
        run: python -m build
      - name: Check distribution contents
        run: python scripts/check_release.py dist
